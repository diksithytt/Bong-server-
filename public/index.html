<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineflayer Live Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        #chat-box { width: 100%; height: 400px; background: #000; overflow-y: auto; padding: 10px; box-sizing: border-box; border: 1px solid #444; margin-bottom: 10px;}
        .sys { color: #f39c12; }
        .mc { color: #fff; }
        input[type="text"] { width: calc(100% - 100px); padding: 10px; background: #333; color: white; border: none; }
        button { width: 80px; padding: 10px; background: #007acc; color: white; border: none; cursor: pointer; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <h2>VENOM Live Dashboard</h2>
    
    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Send a message to Minecraft..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>

    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        socket.on('sysLog', (msg) => { addMessage(msg, 'sys'); });
        socket.on('mcChat', (msg) => { addMessage(msg, 'mc'); });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            socket.emit('sendChat', input.value);
            input.value = '';
        });
    </script>
</body>
</html>
