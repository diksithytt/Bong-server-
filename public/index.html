<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #22c55e; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            margin-top: 0;
            color: #f8fafc;
        }
        #header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b; 
            padding-bottom: 10px;
            margin-bottom: 15px;
            max-width: 800px;
            margin: 0 auto 15px auto;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        #chat-container {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
        }
        #chat-box { 
            background: #020617; 
            height: 500px; 
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid #334155; 
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .msg { margin-bottom: 5px; line-height: 1.4; word-wrap: break-word; }
        .sys-msg { color: #eab308; } 
        .mc-msg { color: #f8fafc; }  
        
        #chat-form {
            display: flex;
            gap: 10px;
        }
        #chat-input { 
            flex-grow: 1; 
            padding: 12px; 
            background: #1e293b; 
            color: #f8fafc; 
            border: 1px solid #475569; 
            border-radius: 5px;
            font-family: inherit;
        }
        #chat-input:focus { outline: none; border-color: #3b82f6; }
        
        button { 
            padding: 12px 25px; 
            color: #020617; 
            border: none; 
            border-radius: 5px;
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-connect { background: #22c55e; }
        .btn-disconnect { background: #ef4444; color: #ffffff; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="header-container">
            <h1>🖥️ BONG Command Center</h1>
            <div class="controls">
                <button class="btn-connect" id="connect-btn">CONNECT</button>
                <button class="btn-disconnect" id="disconnect-btn">DISCONNECT</button>
            </div>
        </div>
        
        <div id="chat-box">
            <div class="msg sys-msg">Waiting for connection to dashboard...</div>
        </div>
        
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type a message to send to the Minecraft server..." autocomplete="off" required>
            <button type="submit" class="btn-connect">SEND</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; 
        }

        // Button Click Event Handlers
        connectBtn.addEventListener('click', () => {
            socket.emit('manualConnect');
        });

        disconnectBtn.addEventListener('click', () => {
            socket.emit('manualDisconnect');
        });

        // Listen for Events from Server
        socket.on('sysLog', (msg) => appendMessage(msg, 'sys-msg'));
        socket.on('mcChat', (msg) => appendMessage(msg, 'mc-msg'));

        // Handle sending text chats
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = chatInput.value;
            socket.emit('sendChat', msg);
            appendMessage(`[DASHBOARD]: ${msg}`, 'sys-msg');
            chatInput.value = ''; 
        });
    </script>
</body>
</html>
